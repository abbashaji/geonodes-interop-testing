name: blender-5.2-tests

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Test script filename to run (must exist in repo root)'
        required: true
      blender_version:
        description: 'Full Blender version to test against, e.g. 5.2.0 or 5.0.1. Defaults to 5.2.0 (this pipeline''s standard version) if omitted.'
        required: false
        default: '5.2.0'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender
        run: |
          FULL_VERSION="${{ inputs.blender_version }}"
          MAJOR_MINOR=$(echo "$FULL_VERSION" | cut -d. -f1,2)
          URL="https://download.blender.org/release/Blender${MAJOR_MINOR}/blender-${FULL_VERSION}-linux-x64.tar.xz"
          echo "Downloading Blender $FULL_VERSION from $URL"
          curl -L -o blender.tar.xz "$URL"
          tar -xf blender.tar.xz
          mv blender-${FULL_VERSION}-linux-x64 blender

      # --- Attempt 1: plain --background (no GPU/display needed at all) ---
      - name: Run test script (background mode)
        id: bg_attempt
        continue-on-error: true
        run: |
          ./blender/blender --background --python "${{ inputs.script }}" 2>&1 | tee output.log

      # --- Fallback: only runs if the background attempt failed, e.g. with
      # a "context is incorrect" error from the FBX operators ---
      - name: Install xvfb + Blender runtime deps (fallback only)
        if: steps.bg_attempt.outcome == 'failure'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxi6 libxrender1 libxrandr2 libxfixes3 libxkbcommon0 libgl1

      - name: Run test script (xvfb fallback)
        if: steps.bg_attempt.outcome == 'failure'
        run: |
          xvfb-run -a ./blender/blender --python "${{ inputs.script }}" 2>&1 | tee output.log

      # --- Produce a token-optimized twin of output.log for pulling back
      # via the github_get_artifact_text tool. Never modifies or replaces
      # output.log itself -- output_condensed.txt is a second, separate
      # file. Only known exporter-warning boilerplate before the
      # "=== VERSION STAMP ===" marker is dropped; everything from that
      # marker onward (ground truth lines, the CELL RESULT JSON) is never
      # touched. See .github/scripts/condense_log.py for the full rules.
      - name: Condense log for retrieval
        if: always()
        run: |
          python3 .github/scripts/condense_log.py output.log || cp output.log output_condensed.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            *.fbx
            *.json
            *.log
            output.log
            output_condensed.txt
