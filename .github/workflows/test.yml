name: blender-5.2-tests

on: workflow_dispatch

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender 5.2.0
        run: |
          curl -L -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          tar -xf blender.tar.xz
          mv blender-5.2.0-linux-x64 blender

      # --- Attempt 1: plain --background (no GPU/display needed at all) ---
      - name: Run test script (background mode)
        id: bg_attempt
        continue-on-error: true
        run: |
          ./blender/blender --background --python usd_export__mixed_instance_types__bake_combined__production_scale_v1.py 2>&1 | tee output.log

      # --- Fallback: only runs if the background attempt failed, e.g. with
      # a "context is incorrect" error from operators that need a window ---
      - name: Install xvfb + Blender runtime deps (fallback only)
        if: steps.bg_attempt.outcome == 'failure'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxi6 libxrender1 libxrandr2 libxfixes3 libxkbcommon0 libgl1

      - name: Run test script (xvfb fallback)
        if: steps.bg_attempt.outcome == 'failure'
        run: |
          xvfb-run -a ./blender/blender --python usd_export__mixed_instance_types__bake_combined__production_scale_v1.py 2>&1 | tee output.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            *.fbx
            *.usdc
            *.json
            *.log
            output.log
