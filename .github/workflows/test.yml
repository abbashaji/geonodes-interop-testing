name: blender-5.2-tests

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Test script filename to run (must exist in repo root)'
        required: true
      blender_version:
        description: 'Full Blender version to test against, e.g. 5.2.0 or 5.0.1. Defaults to 5.2.0 (this pipeline''s standard version) if omitted.'
        required: false
        default: '5.2.0'
      force_xvfb:
        description: 'Skip the --background attempt entirely and force headful (xvfb) mode, for isolating headless-vs-headful as a variable. Defaults to false (normal background-first behavior).'
        required: false
        default: 'false'
      timeout_minutes:
        description: 'Outer job timeout in minutes -- a last-resort backstop only. The real hang detection is the CPU-idle watchdog (kills within ~90s of true idle, no matter how long the job has been running); this cap exists in case the watchdog itself is somehow bypassed. Safe to leave high even for heavy tests.'
        required: false
        default: '60'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender
        run: |
          FULL_VERSION="${{ inputs.blender_version }}"
          MAJOR_MINOR=$(echo "$FULL_VERSION" | cut -d. -f1,2)
          URL="https://download.blender.org/release/Blender${MAJOR_MINOR}/blender-${FULL_VERSION}-linux-x64.tar.xz"
          echo "Downloading Blender $FULL_VERSION from $URL"
          curl -L --max-time 300 -o blender.tar.xz "$URL"
          tar -xf blender.tar.xz
          mv blender-${FULL_VERSION}-linux-x64 blender

      # --- Attempt 1: plain --background (no GPU/display needed at all) ---
      # Skipped entirely when force_xvfb=true. A mode marker is written into
      # output.log so retrieval never has to guess which path actually ran
      # (this was previously ambiguous -- both paths used a plain `tee`,
      # so the fallback would silently overwrite any trace of attempt 1).
      #
      # Wrapped in cpu_watchdog_run.sh: kills the process only if runner
      # CPU has been genuinely idle for a sustained window (see script
      # for tunables), not on a fixed wall-clock timeout. A crash that
      # doesn't quit Blender (KB harness note) gets caught in ~90-100s;
      # a heavy-but-working test is left alone no matter how long it runs.
      - name: Run test script (background mode)
        id: bg_attempt
        if: inputs.force_xvfb != 'true'
        continue-on-error: true
        run: |
          echo "=== EXECUTION MODE: background (--background) ===" > output.log
          bash .github/scripts/cpu_watchdog_run.sh ./blender/blender --background --python "${{ inputs.script }}" 2>&1 | tee -a output.log

      # --- Fallback: runs if the background attempt failed (e.g. a "context
      # is incorrect" error from operators needing a window/screen), OR if
      # force_xvfb=true was explicitly requested to isolate headful mode. ---
      - name: Install xvfb + Blender runtime deps (fallback/forced)
        if: steps.bg_attempt.outcome == 'failure' || inputs.force_xvfb == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxi6 libxrender1 libxrandr2 libxfixes3 libxkbcommon0 libgl1

      # Also watchdog-wrapped -- xvfb-run's own child (blender) is caught
      # by the process-group kill in cpu_watchdog_run.sh, same as above.
      - name: Run test script (xvfb)
        if: steps.bg_attempt.outcome == 'failure' || inputs.force_xvfb == 'true'
        run: |
          if [ "${{ inputs.force_xvfb }}" = "true" ]; then
            echo "=== EXECUTION MODE: xvfb (forced, background attempt skipped) ===" > output.log
          else
            echo "=== EXECUTION MODE: xvfb (fallback after background attempt failed) ===" >> output.log
          fi
          bash .github/scripts/cpu_watchdog_run.sh xvfb-run -a ./blender/blender --python "${{ inputs.script }}" 2>&1 | tee -a output.log

      # --- Produce a token-optimized twin of output.log for pulling back
      # via the github_get_artifact_text tool. Never modifies or replaces
      # output.log itself -- output_condensed.txt is a second, separate
      # file. Only known exporter-warning boilerplate before the
      # "=== VERSION STAMP ===" marker is dropped; everything from that
      # marker onward (ground truth lines, the CELL RESULT JSON) is never
      # touched. The new EXECUTION MODE marker line is always before that
      # point and is explicitly preserved regardless. See
      # .github/scripts/condense_log.py for the full rules.
      - name: Condense log for retrieval
        if: always()
        run: |
          python3 .github/scripts/condense_log.py output.log || cp output.log output_condensed.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            *.fbx
            *.json
            *.log
            output.log
            output_condensed.txt
